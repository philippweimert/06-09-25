services:
  # Backend Service
  - type: web
    name: acencia-backend
    env: python
    pythonVersion: "3.11.9"
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn server:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: MONGO_URL
        sync: false  # Set manually in Render dashboard
      - key: DB_NAME
        value: acencia_production
      - key: CORS_ORIGINS
        value: https://acencia-frontend.onrender.com,http://localhost:3000
      - key: ENVIRONMENT
        value: production

  # Frontend Service  
  - type: web
    name: acencia-frontend
    env: node
    nodeVersion: "18.17.0"
    buildCommand: "cd frontend && yarn install && yarn build"
    startCommand: "cd frontend && serve -s build"
    envVars:
      - key: REACT_APP_BACKEND_URL
        value: https://acencia-backend.onrender.com/api